[workspace]
resolver = "3"
members = ["client", "common", "server"]

[workspace.dependencies]
# internal
common = { path = "common" }

# external
chrono = "0.4.41"
lzma-rust2 = { version = "0.15.1", features = ["std"] }
hex = "0.4.3"
anyhow = "1.0.100"
futures = "0.3.31"
futures-core = "0.3.31"
clap = { version = "4.5.40", features = ["derive"] }
sha2 = "0.10.9"
ureq = "3.0.12"
tokio = { version = "1.45.1", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.15", features = ["codec", "io"] }
tower-http = { version = "0.6.6", features = [
    "compression-br",
    "compression-deflate",
    "compression-gzip",
    "compression-zstd",
] }
http-body = "1.0.1"
lazy_static = "1.5.0"
opendal = { version = "0.54.1", features = ["services-fs", "services-s3"] }
axum = { version = "0.8.4", features = ["macros"] }
flate2 = { version = "1.1.5", features = ["zlib-rs"] }
serde ={ version = "1.0.228", features = ["derive"] }
bytes = "1.10.1"